<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B3D9FB">
<link rel="icon" href="woogle-logo.png">
<link rel="apple-touch-icon" href="woogle-logo.png">
<title>우글우글</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: 데스크톱에서도 폭 440px 모바일 화면 하나만 가운데 띄우고, 그 안을 지역색으로 100% 채운 뒤 흰 카드를 올리는 구조 */
:root{
  --orange:#FB7201; --orange-2:#FB9600; --yellow:#FCCB01; --blue:#01A1FB; --blue-deep:#0060EA;
  --pink:#FC9EC9; --pink-deep:#E64C93; --cream:#FFE7D4; --white:#FFFFFF; --ink:#2A1A0C; --ink-soft:#6B5442;
  --line:#F1E2D3; --danger:#E5361F;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r-card:22px; --r-pill:999px;
  --bg:var(--orange); --on-bg:var(--white); --strong:var(--orange);
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);font-size:20px;line-height:1.6;letter-spacing:-.2px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.app{max-width:440px;min-height:100%;margin:0 auto;background:var(--bg);color:var(--on-bg);position:relative;box-shadow:0 0 0 1px rgba(42,26,12,.06),0 20px 60px rgba(42,26,12,.18);transition:background .25s}
.region-guri{--bg:var(--blue);--on-bg:var(--white);--strong:var(--blue-deep)}
.region-nam{--bg:var(--yellow);--on-bg:var(--ink);--strong:var(--orange)}
.region-jin{--bg:var(--pink);--on-bg:var(--ink);--strong:var(--pink-deep)}
.region-home{--bg:var(--orange);--on-bg:var(--white);--strong:var(--orange)}

.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 헤더 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;transition:background .25s}
.brand{margin:0;line-height:0}
.brand img{height:52px;width:auto;display:block}
.brand button{all:unset;cursor:pointer}
.top-right{display:flex;align-items:center;gap:8px;min-width:0}
.bell{position:relative;width:40px;height:40px;border-radius:50%;border:2px solid currentColor;background:transparent;display:grid;place-items:center;flex:none}
.bell svg{width:20px;height:20px}
.bell .dot{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--ink);color:var(--white);font-size:13px;line-height:20px;text-align:center;font-family:var(--font)}
.me{border:0;background:var(--white);color:var(--ink);border-radius:var(--r-pill);padding:7px 14px;font-weight:800;font-size:18px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .adm{font-size:12px;background:var(--orange);color:var(--white);border-radius:6px;padding:1px 5px;margin-left:5px;vertical-align:2px;font-weight:700}

.banner{margin:4px 0 0;background:var(--white);color:var(--ink);border-radius:14px;padding:9px 14px;font-size:14.5px;line-height:1.4}

/* 지역 탭 */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-block:6px 4px}
.tab{border:2.5px solid var(--white);background:transparent;color:var(--on-bg);border-radius:16px;padding:12px 4px;font-size:20px;font-weight:700;min-height:52px;transition:transform .15s}
.region-nam .tab,.region-jin .tab{border-color:var(--ink)}
.tab[aria-selected="true"]{background:var(--white);color:var(--ink);border-color:var(--white);box-shadow:0 4px 0 rgba(42,26,12,.18)}
.region-nam .tab[aria-selected="true"],.region-jin .tab[aria-selected="true"]{border-color:var(--ink)}
.tab .dotc{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;border:1.5px solid var(--ink);vertical-align:1px}

/* CTA */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:22px 18px}
.hero p{margin:0;font-size:19px;font-weight:500;opacity:.95}
.cta{border:3px solid var(--ink);background:var(--white);color:var(--ink);border-radius:var(--r-pill);padding:15px 30px;font-size:23px;font-weight:800;box-shadow:0 5px 0 var(--ink);display:inline-flex;align-items:center;gap:10px;transition:transform .12s,box-shadow .12s}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.cta svg{width:24px;height:24px;color:var(--strong)}
.cta[disabled]{opacity:.55;cursor:not-allowed}

/* 리스트 */
.list-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:6px 8px}
.list-head h2{margin:0;font-size:23px;font-weight:800}
.list-head h2 small{font-size:18px;font-weight:700;opacity:.85;margin-left:4px}
.seg{display:inline-flex;background:rgba(255,255,255,.28);border-radius:var(--r-pill);padding:3px;gap:2px}
.region-nam .seg,.region-jin .seg{background:rgba(42,26,12,.1)}
.seg button{border:0;background:transparent;color:var(--on-bg);border-radius:var(--r-pill);padding:8px 14px;font-size:17px;font-weight:700;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--ink)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-block:2px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid currentColor;background:transparent;color:var(--on-bg);border-radius:var(--r-pill);padding:8px 15px;font-size:17px;font-weight:600;min-height:44px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--white);border-color:var(--ink)}
.cards{display:flex;flex-direction:column;gap:14px;padding-bottom:40px}

.card{background:var(--white);color:var(--ink);border-radius:var(--r-card);padding:16px 16px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 3px 0 rgba(42,26,12,.12);min-width:0}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{font-size:15px;font-weight:600;line-height:1;padding:6px 9px;border-radius:8px;background:var(--cream);color:var(--ink)}
.badge.rg-guri{background:var(--blue);color:var(--white)}
.badge.rg-nam{background:var(--yellow)}
.badge.rg-jin{background:var(--pink)}
.badge.ex{background:var(--ink);color:var(--white)}
.tools{display:flex;gap:2px;flex:none}
.icon-btn{width:32px;height:32px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--ink-soft)}
.icon-btn:hover{background:var(--cream);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.del:hover{color:var(--danger)}
.card h3{margin:2px 0 0;font-size:25px;font-weight:800;line-height:1.25;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.meta{font-size:16.5px;color:var(--ink-soft)}
.meta b{color:var(--ink);font-weight:700}
.body{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:20px;line-height:1.65}
.body.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:6px;padding-top:10px;border-top:2px dashed var(--line)}
.heart{position:relative;width:46px;height:46px;border:0;background:transparent;padding:0;display:grid;place-items:center;flex:none}
.heart svg{width:34px;height:34px;overflow:visible}
.heart path{fill:var(--white);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;transition:fill .2s}
.heart.on path{fill:var(--orange)}
.heart[disabled]{cursor:default}
.heart.pop svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(.7)}65%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(1)}}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;margin:-3.5px;animation:burst .6s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
.with{flex:1;min-width:0;font-size:18px}
.with b{font-weight:800;color:var(--orange);font-size:22px}
.cmt-btn{border:2px solid var(--ink);background:var(--white);border-radius:var(--r-pill);padding:8px 14px;font-size:17px;font-weight:700;display:inline-flex;align-items:center;gap:5px;flex:none;min-height:44px}
.cmt-btn svg{width:16px;height:16px}

.empty{background:var(--white);color:var(--ink);border-radius:var(--r-card);padding:28px 20px;text-align:center;font-size:19px}
.empty strong{display:block;font-size:22px;font-weight:800;margin-bottom:4px}

/* 로그인 */
.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:40px}
.login .logo{margin:0;line-height:0}
.login .logo img{width:min(62%,250px);height:auto;display:block}
.login p.lead{margin:0;color:var(--white);font-size:21px;font-weight:600;line-height:1.5}
.login form{background:var(--white);color:var(--ink);border-radius:26px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 rgba(42,26,12,.2)}
.login label{font-size:21px;font-weight:700}
.login .hint{font-size:16.5px;color:var(--ink-soft);margin:0}
.login .dots{display:flex;gap:8px}
.login .dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink)}
.field{width:100%;box-sizing:border-box;border:2.5px solid var(--ink);border-radius:16px;padding:13px 14px;font-size:20px;background:var(--white)}
.field:focus{outline:none;box-shadow:0 0 0 4px var(--yellow)}
.btn{border:3px solid var(--ink);background:var(--orange);color:var(--white);border-radius:var(--r-pill);padding:13px 20px;font-size:21px;font-weight:800;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--white);color:var(--ink)}
.err{color:var(--danger);font-size:17px;margin:0;min-height:1em}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(42,26,12,.45);z-index:50;display:flex;justify-content:center;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:440px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--white);color:var(--ink);border-radius:26px 26px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));box-sizing:border-box;animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.sheet-head h2{margin:0;font-size:24px;font-weight:800}
.x{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:var(--white);display:grid;place-items:center;flex:none}
.x svg{width:16px;height:16px}
.form{display:flex;flex-direction:column;gap:16px}
.form .lbl{font-size:19px;font-weight:700;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.form .lbl small{color:var(--ink-soft);font-size:15.5px;font-weight:500}
.rg-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rg-pick button{border:2.5px solid var(--ink);border-radius:14px;padding:14px 4px;font-size:19px;font-weight:700;background:var(--white)}
.rg-pick button[aria-pressed="true"].g{background:var(--blue);color:var(--white)}
.rg-pick button[aria-pressed="true"].n{background:var(--yellow)}
.rg-pick button[aria-pressed="true"].j{background:var(--pink)}
.cat-pick{display:flex;flex-wrap:wrap;gap:7px}
.cat-pick button{border:2px solid var(--ink);border-radius:var(--r-pill);padding:9px 16px;font-size:18px;font-weight:600;background:var(--white)}
.cat-pick button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
textarea.field{min-height:180px;resize:vertical;line-height:1.6;font-size:20px}
.preview{background:var(--cream);border-radius:14px;padding:10px 14px;font-size:20px;font-weight:700}
.preview small{display:block;font-size:15px;font-weight:500;color:var(--ink-soft)}

/* 상세 + 댓글 */
.detail-post{border-left:6px solid var(--strong);padding-left:12px;margin-bottom:6px}
.cmts{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.cmts h3{margin:0 0 6px;font-size:21px;font-weight:800}
.cmt{padding:10px 0;border-top:2px dashed var(--line);display:flex;flex-direction:column;gap:4px}
.cmt-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cmt-top .meta{min-width:0}
.cmt p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:19px}
.cmt .edit-row{display:flex;gap:6px;justify-content:flex-end}
.cmt .edit-row button{border:2px solid var(--ink);border-radius:var(--r-pill);background:var(--white);padding:3px 12px;font-size:15px}
.cmt .edit-row button.save{background:var(--ink);color:var(--white)}
.cmt-form{display:flex;gap:8px;margin-top:10px;position:sticky;bottom:0;background:var(--white);padding-block:8px 0}
.cmt-form input{flex:1;min-width:0;border:2.5px solid var(--ink);border-radius:var(--r-pill);padding:12px 16px;font-size:19px}
.cmt-form input:focus{outline:none;box-shadow:0 0 0 4px var(--yellow)}
.cmt-form button{border:0;background:var(--orange);color:var(--white);border-radius:var(--r-pill);padding:0 18px;font-size:19px;font-weight:700;flex:none}
.no-cmt{color:var(--ink-soft);font-size:18px;padding:10px 0}

/* 알림 */
.noti{display:flex;flex-direction:column}
.noti button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:12px 2px;border-top:2px dashed var(--line)}
.noti .ic{width:30px;height:30px;border-radius:50%;background:var(--cream);display:grid;place-items:center;flex:none}
.noti .ic svg{width:17px;height:17px}
.noti .new .ic{background:var(--orange);color:var(--white)}
.noti .t{font-size:18px;line-height:1.4}
.noti .t small{display:block;color:var(--ink-soft);font-size:15px}

/* 마이페이지 */
.back{border:2px solid currentColor;background:transparent;color:var(--on-bg);border-radius:var(--r-pill);padding:8px 14px;font-size:17px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.profile{background:var(--white);color:var(--ink);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:10px;margin-block:8px 14px;box-shadow:0 4px 0 rgba(42,26,12,.18)}
.profile .name{font-size:30px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.profile .name .adm{font-size:15px;font-weight:700;background:var(--orange);color:var(--white);border-radius:8px;padding:2px 8px;vertical-align:5px;margin-left:6px}
.belong{font-size:18px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.belong .none{background:var(--cream);border-radius:10px;padding:8px 12px;font-size:17px;font-weight:600}
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pstats div{background:var(--cream);border-radius:14px;padding:10px 12px}
.pstats b{display:block;font-weight:800;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.pstats span{font-size:16px;color:var(--ink-soft)}
.mtabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.mtabs button{flex:none;border:2.5px solid var(--white);background:transparent;color:var(--white);border-radius:var(--r-pill);padding:9px 16px;font-size:18px;font-weight:700}
.mtabs button[aria-selected="true"]{background:var(--white);color:var(--ink)}
.linkish{border:0;background:transparent;color:var(--on-bg);text-decoration:underline;text-underline-offset:3px;font-size:15px;padding:6px 0;align-self:center;font-size:17px}

/* 대시보드 */
.dash{display:flex;flex-direction:column;gap:14px;padding-bottom:40px}
.panel{background:var(--white);color:var(--ink);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{margin:0;font-size:21px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h3 small{font-size:15px;font-weight:500;color:var(--ink-soft)}
.dseg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(255,255,255,.3);padding:4px;border-radius:16px}
.dseg button{border:0;background:transparent;color:var(--white);border-radius:12px;padding:10px 2px;font-size:17px;font-weight:700}
.dseg button[aria-pressed="true"]{background:var(--white);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{border-radius:16px;padding:12px 10px;background:var(--cream);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-weight:800;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:15px;color:var(--ink-soft);line-height:1.3}
.kpi.k1{background:var(--blue);color:var(--white)}.kpi.k1 span{color:rgba(255,255,255,.9)}
.kpi.k2{background:var(--yellow)}
.kpi.k3{background:var(--pink)}
.kpi.k2 span,.kpi.k3 span{color:var(--ink)}
.note{font-size:16px;color:var(--ink-soft);margin:0}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:17px}
th,td{padding:8px 6px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-weight:700;color:var(--ink-soft);font-size:15px;border-bottom:2px solid var(--ink)}
tbody tr+tr td{border-top:1.5px dashed var(--line)}
tfoot td{border-top:2px solid var(--ink)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:84px 1fr 72px;align-items:center;gap:8px;font-size:17px}
.bar-track{height:18px;background:var(--cream);border-radius:9px;overflow:hidden}
.bar-fill{height:100%;border-radius:9px;background:var(--orange);min-width:2px}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums;font-size:15.5px}
.log{display:flex;flex-direction:column}
.log-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1.5px dashed var(--line)}
.log-item:first-child{border-top:0}
.log-item .txt{flex:1;min-width:0;font-size:17px;line-height:1.4}
.log-item .txt small{display:block;color:var(--ink-soft);font-size:15px}
.log-item .kind{font-size:12px;background:var(--ink);color:var(--white);border-radius:6px;padding:1px 6px;margin-right:4px;vertical-align:1px}
.restore{border:2px solid var(--ink);background:var(--yellow);border-radius:var(--r-pill);padding:8px 14px;font-size:16px;font-weight:700;flex:none}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--white);padding:12px 20px;border-radius:var(--r-pill);font-size:18px;z-index:80;max-width:calc(100% - 40px);text-align:center;animation:up .25s}

.loading{padding-block:80px;text-align:center;font-size:21px}

/* 우글우글 포스터를 앱 전체 배경으로 */
:root{--sky:#B3D9FB}
body::before{background:var(--sky)}
.app{background:var(--sky);color:var(--ink);--on-bg:var(--ink)}
.app::before{content:"";position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);background:var(--sky) url("woogle-bg.jpg") center top/cover no-repeat;z-index:0;pointer-events:none}
#view{position:relative;z-index:1}
.top{background:rgba(179,217,251,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tab,.region-nam .tab,.region-jin .tab{background:rgba(255,255,255,.88);color:var(--ink);border-color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.region-guri .tab[aria-selected="true"]{background:var(--blue);color:var(--white)}
.region-nam .tab[aria-selected="true"]{background:var(--yellow)}
.region-jin .tab[aria-selected="true"]{background:var(--pink)}
.hero p{background:rgba(255,255,255,.92);color:var(--ink);border-radius:var(--r-pill);padding:6px 16px;opacity:1}
.list-head h2{background:rgba(255,255,255,.92);border-radius:14px;padding:4px 14px}
.seg,.region-nam .seg,.region-jin .seg{background:rgba(255,255,255,.9)}
.seg button{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.chip{background:rgba(255,255,255,.92);color:var(--ink);border-color:var(--ink)}
.back,.linkish{color:var(--ink)}
.back{background:rgba(255,255,255,.92);border-color:var(--ink)}
.linkish{background:rgba(255,255,255,.85);border-radius:var(--r-pill);padding:6px 14px}
.mtabs button{background:rgba(255,255,255,.9);color:var(--ink);border-color:var(--ink)}
.mtabs button[aria-selected="true"]{background:var(--ink);color:var(--white)}
.dseg{background:rgba(255,255,255,.9)}
.dseg button{color:var(--ink)}
.dseg button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.login{justify-content:flex-start;padding-block:calc(51vh) 24px;padding-block:calc(51dvh) 24px;gap:0}
.login form{padding:16px 18px;gap:9px;background:rgba(255,255,255,.96)}
.login .dots{display:none}
.login label{font-size:20px}
.login .hint{font-size:15.5px}
.login .err:empty{display:none}
.login{position:relative}
.start-wrap{position:absolute;left:0;right:0;top:63%;display:flex;justify-content:center}
.start-btn{font-size:26px;padding:16px 56px;min-width:220px;box-shadow:0 5px 0 var(--ink)}
.login .logo,.login p.lead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.login form{box-shadow:0 6px 0 rgba(42,26,12,.25)}

/* 첫 화면: 포스터 위쪽(제목·리본) → 시작하기 → 포스터 아래쪽(캐릭터) */
.login-mode::before{display:none}
.login{padding:0!important;gap:0!important;justify-content:center;min-height:100vh;min-height:100dvh;overflow:hidden;background:linear-gradient(var(--sky) 50%,#335942 50%)}
.lg-top{display:block;width:88%;max-width:400px;margin:0 auto}
.lg-mid{display:flex;flex-direction:column;align-items:center;padding-block:2px 4px;background:var(--sky)}
.lg-mid form{width:100%;box-sizing:border-box}
.start-wrap{position:static!important}
.start-btn{font-size:21px!important;padding:11px 40px!important;min-width:0!important}
.lg-bottom{display:block;width:100%;margin-top:-2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="app region-home" id="app">
  <div id="view"><div class="loading gut">우글우글을 여는 중이에요…</div></div>
</div>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
/* ---------- 기본값 ---------- */
const REGIONS=[{k:"guri",n:"구리권",cls:"region-guri",b:"rg-guri",p:"g",col:"#01A1FB"},{k:"nam",n:"남양주권",cls:"region-nam",b:"rg-nam",p:"n",col:"#FCCB01"},{k:"jin",n:"진접권",cls:"region-jin",b:"rg-jin",p:"j",col:"#FC9EC9"}];
const RG=Object.fromEntries(REGIONS.map(r=>[r.k,r]));
const CATS=["건강","시험","취업","우정&연애","가족"];
const ADMINS=["박세은","김수지","박현빈","김주희"];
const BODY_MAX=500, TARGET_MAX=20, NICK_MAX=10, CMT_MAX=200;

/* ---------- 아이콘 ---------- */
const I={
 heart:'<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 27.4c-1.3-1-10.9-7.5-11.7-14.1C3.7 8.7 6.9 5.3 10.6 5.6c2.6.3 4.4 2.3 5.4 4.5 1.1-2.4 3.1-4.5 5.8-4.6 3.8-.1 6.6 3.5 5.8 7.7-1.2 6.6-10.3 13.1-11.6 14.2z"/></svg>',
 bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16.5c1-1.2 1.3-2.6 1.3-5.2A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 4.7 4.9c0 2.6.3 4 1.3 5.2z"/><path d="M10.2 19.2a2 2 0 0 0 3.6 0"/><path d="M12 4v2.3"/></svg>',
 pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.8 4.6l3.6 3.6L9 18.6l-4.6 1 1-4.6z"/></svg>',
 trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 7h15"/><path d="M9.5 7V4.8h5V7"/><path d="M6.5 7.2l.9 12.3h9.2l.9-12.3"/></svg>',
 bubble:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.2c0-4 3.4-7 7.6-7s7.6 3 7.6 7-3.4 6.8-7.6 6.8c-1 0-2-.2-2.9-.5L5 19.8l1.1-3.6a6.3 6.3 0 0 1-1.6-4z"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5c.6 4.4 2.3 6.4 6.8 7.6-4.5 1.2-6.2 3.2-6.8 7.6-.6-4.4-2.3-6.4-6.8-7.6 4.5-1.2 6.2-3.2 6.8-7.6z"/></svg>'
};

/* ---------- 유틸 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=()=>Date.now();
const mkId=()=>(crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));
const hex=s=>Array.from(new TextEncoder().encode(s)).map(b=>b.toString(16).padStart(2,"0")).join("");
function josa(w){const c=(w||"").trim().slice(-1).charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3)return (c-0xAC00)%28?"을":"를";return "를";}
const titleOf=t=>`${t}${josa(t)} 위한 기원`;
function ago(ms){const d=(now()-ms)/1000;if(d<60)return "방금 전";if(d<3600)return Math.floor(d/60)+"분 전";if(d<86400)return Math.floor(d/3600)+"시간 전";if(d<604800)return Math.floor(d/86400)+"일 전";const t=new Date(ms);return `${t.getFullYear()}.${t.getMonth()+1}.${t.getDate()}`;}
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(msg){const old=$(".toast");if(old)old.remove();const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}

/* ---------- 저장소 (Supabase 공유 DB, 로그인 없이 모두 공유) ---------- */
const SB_URL="https://c--4bd4191c-7b60-4fc3-b060-eb7e26b89e78-prod.lovable.cloud";
const SB_KEY="sb_publishable_dc-byJXrTOZTlWkQv_FarQ_huCH8zZB";
const COLLS=["users","posts","likes","comments"];
const S={users:new Map(),posts:new Map(),likes:new Map(),comments:new Map()};
const store={mode:"loading",sb:null,canWrite:true};
const RK={guri:"구리권",nam:"남양주권",jin:"진접권"}, KR={"구리권":"guri","남양주권":"nam","진접권":"jin"};
const iso=v=>v==null?null:new Date(v).toISOString(), tms=v=>v?Date.parse(v):null;
const MAP={
 users:{to:d=>({nick:d.nick,region:d.region?RK[d.region]:null,created_at:iso(d.createdAt)}),
        from:r=>({nick:r.nick,region:r.region?KR[r.region]||null:null,createdAt:tms(r.created_at)})},
 posts:{to:d=>({target:d.target,body:d.body,cats:d.cats||[],region:RK[d.region]||d.region,author:d.author,author_hx:d.authorHx,created_at:iso(d.createdAt),edited_at:iso(d.editedAt),deleted:!!d.deleted,deleted_at:iso(d.deletedAt),deleted_by:d.deletedBy||null,restored_at:iso(d.restoredAt),example:!!d.example}),
        from:r=>({target:r.target,body:r.body,cats:r.cats||[],region:KR[r.region]||"guri",author:r.author,authorHx:r.author_hx,createdAt:tms(r.created_at),editedAt:tms(r.edited_at),deleted:!!r.deleted,deletedAt:tms(r.deleted_at),deletedBy:r.deleted_by,restoredAt:tms(r.restored_at),example:!!r.example})},
 likes:{to:d=>({post_id:d.postId,nick_hx:d.nickHx,region:RK[d.region]||d.region,created_at:iso(d.createdAt)}),
        from:r=>({postId:r.post_id,nickHx:r.nick_hx,region:KR[r.region]||r.region,createdAt:tms(r.created_at)})},
 comments:{to:d=>({post_id:d.postId,body:d.body,author:d.author,author_hx:d.authorHx,created_at:iso(d.createdAt),edited_at:iso(d.editedAt),deleted:!!d.deleted,deleted_at:iso(d.deletedAt),deleted_by:d.deletedBy||null}),
        from:r=>({postId:r.post_id,body:r.body,author:r.author,authorHx:r.author_hx,createdAt:tms(r.created_at),editedAt:tms(r.edited_at),deleted:!!r.deleted,deletedAt:tms(r.deleted_at),deletedBy:r.deleted_by})}
};
async function loadColl(c){
  const {data,error}=await store.sb.from(c).select("*").limit(5000);
  if(error){console.warn(c,error);return}
  const m=new Map();data.forEach(r=>m.set(r.id,Object.assign({id:r.id},MAP[c].from(r))));S[c]=m;schedule();
}
async function initStore(){
  store.mode="db";
  store.sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});
  await Promise.all(COLLS.map(loadColl));
  const timers={};
  store.sb.channel("woogle").on("postgres_changes",{event:"*",schema:"public"},p=>{const t=p.table;if(!COLLS.includes(t))return;clearTimeout(timers[t]);timers[t]=setTimeout(()=>loadColl(t),250)}).subscribe();
  setInterval(()=>{if(!document.hidden)COLLS.forEach(loadColl)},20000);
}
function writeErr(e){console.warn(e);toast("저장하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.");}
async function put(coll,id,data){
  const row=Object.assign({id},MAP[coll].to(data));
  S[coll].set(id,Object.assign({id},data));schedule();
  const {error}=await store.sb.from(coll).upsert(row);
  if(error){writeErr(error);loadColl(coll);throw error}
}
async function patch(coll,id,p){
  const cur=S[coll].get(id);if(!cur)return;
  const next=Object.assign({},cur,p);delete next.id;
  await put(coll,id,next);
}

/* ---------- 상태 ---------- */
const st={
  nick:ls.get("woogle.nick",""),view:"login",region:ls.get("woogle.region","guri"),
  sort:"new",cats:new Set(),expanded:new Set(),mtab:"mine",dRegion:"all",
  sheet:null,editingCmt:null,justLiked:null
};
const me=()=>({nick:st.nick,hx:hex(st.nick)});
const isAdmin=()=>ADMINS.includes(st.nick);
const livePosts=()=>[...S.posts.values()].filter(p=>!p.deleted);
const liveCmts=pid=>[...S.comments.values()].filter(c=>c.postId===pid&&!c.deleted).sort((a,b)=>a.createdAt-b.createdAt);
const likeCount=pid=>{let n=0;S.likes.forEach(l=>{if(l.postId===pid)n++});return n};
const liked=pid=>S.likes.has(pid+"_"+me().hx);
const myUser=()=>S.users.get(me().hx);

/* ---------- 렌더 ---------- */
let rq=0;function schedule(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render();});}
function setTheme(cls){const a=$("#app");a.className="app "+cls;const col=getComputedStyle(a).getPropertyValue("--bg");document.documentElement.style.setProperty("--bg",col);}

function render(){
  if(st.view==="login"){if(!$("#nick-form"))renderLogin();return;}
  if(st.view==="main")renderMain();else renderMy();
  refreshSheet();
}

function headerHTML(){
  const n=notiList().filter(x=>x.isNew).length;
  return `<header class="top gut"><h1 class="brand"><button data-act="home" aria-label="우글우글 처음으로"><img src="woogle-logo.png" alt="우글우글"></button></h1>
  <div class="top-right"><button class="bell" data-act="noti" aria-label="알림 ${n}개">${I.bell}${n?`<span class="dot">${n>99?"99+":n}</span>`:""}</button>
  <button class="me" data-act="my" aria-label="마이페이지">${esc(st.nick)}${isAdmin()?'<span class="adm">관리자</span>':""}</button></div></header>
  ${bannerHTML()}`;
}
function bannerHTML(){return ""}

function renderLogin(){
  setTheme("region-home login-mode");
  $("#view").innerHTML=`<div class="login">
   <h1 class="logo">우글우글</h1>
   <img class="lg-top" src="login-top.webp" alt="경기 8방면 연찬 육성 프로젝트 우글우글, 9월~11월 15일 체험담 대회">
   <div class="lg-mid gut">
    <div class="start-wrap" id="start-wrap"><button class="btn start-btn" type="button" data-act="startlogin">시작하기</button></div>
    <form id="nick-form" novalidate hidden>
     <label for="nick-in">닉네임을 정해 주세요</label>
     <input class="field" id="nick-in" maxlength="${NICK_MAX}" autocomplete="off" placeholder="예: 진접동 햇살" value="${esc(st.nick)}">
     <p class="hint">2~${NICK_MAX}자. 이 닉네임으로 기원문과 댓글이 남아요.</p>
     <p class="err" id="nick-err"></p>
     <button class="btn" id="nick-go" type="submit">들어가기</button>
    </form>
   </div>
   <img class="lg-bottom" src="login-bottom.webp" alt="">
  </div>`;
}

function postCard(p,opts={}){
  const r=RG[p.region]||RG.guri, mine=p.authorHx===me().hx, n=likeCount(p.id), on=liked(p.id), cc=liveCmts(p.id).length;
  const open=opts.full||st.expanded.has(p.id);
  const tools=(mine||isAdmin())?`<div class="tools">${mine?`<button class="icon-btn" data-act="edit" data-id="${p.id}" aria-label="기원문 수정">${I.pen}</button>`:""}<button class="icon-btn del" data-act="delpost" data-id="${p.id}" aria-label="기원문 삭제">${I.trash}</button></div>`:"";
  return `<article class="card" data-post="${p.id}">
   <div class="card-top"><div class="badges">${opts.showRegion?`<span class="badge ${r.b}">${r.n}</span>`:""}${(p.cats||[]).map(c=>`<span class="badge">${esc(c)}</span>`).join("")}${p.example?'<span class="badge ex">예시</span>':""}</div>${tools}</div>
   <h3>${esc(titleOf(p.target))}</h3>
   <div class="meta"><b>${esc(p.author)}</b> · ${ago(p.createdAt)}${p.editedAt?" · 수정됨":""}</div>
   <p class="body${open?"":" clamp"}" ${open?"":`data-act="expand" data-id="${p.id}"`}>${esc(p.body)}</p>
   <div class="card-foot">
     <button class="heart${on?" on":""}${st.justLiked===p.id?" pop":""}" data-act="like" data-id="${p.id}" ${on?'disabled aria-label="함께 기원했어요"':'aria-label="함께 기원하기"'}>${I.heart}${st.justLiked===p.id?burst():""}</button>
     <span class="with"><b>${n}</b>명이 함께 기원 중</span>
     ${opts.full?"":`<button class="cmt-btn" data-act="open" data-id="${p.id}">${I.bubble}<span>댓글 ${cc}</span></button>`}
   </div></article>`;
}
function burst(){const cols=["#FB7201","#01A1FB","#FCCB01","#FC9EC9","#0060EA","#FB9600"];return `<span class="burst">${cols.map((c,i)=>{const a=i/cols.length*Math.PI*2;return `<i style="background:${c};--x:${Math.cos(a)*30}px;--y:${Math.sin(a)*30}px"></i>`}).join("")}</span>`;}

function renderMain(){
  const r=RG[st.region];setTheme(r.cls);
  let list=livePosts().filter(p=>p.region===st.region);
  if(st.cats.size)list=list.filter(p=>(p.cats||[]).some(c=>st.cats.has(c)));
  list.sort(st.sort==="new"?(a,b)=>b.createdAt-a.createdAt:(a,b)=>(likeCount(b.id)-likeCount(a.id))||(b.createdAt-a.createdAt));
  const total=livePosts().filter(p=>p.region===st.region).length;
  $("#view").innerHTML=`${headerHTML()}
  <nav class="tabs gut" role="tablist" aria-label="지역">${REGIONS.map(x=>`<button class="tab" role="tab" aria-selected="${x.k===st.region}" data-act="region" data-r="${x.k}"><span class="dotc" style="background:${x.col}"></span>${x.n}</button>`).join("")}</nav>
  <section class="hero gut"><p>${r.n} 이웃들의 기원을 함께 모아요</p>
   <button class="cta" data-act="write" ${store.canWrite?"":"disabled"}>${I.spark}나의 기원문 공유하기</button></section>
  <section class="gut">
   <div class="list-head"><h2>등록된 기원 이야기<small>${total}</small></h2>
    <div class="seg" role="group" aria-label="정렬"><button data-act="sort" data-s="new" aria-pressed="${st.sort==="new"}">최신순</button><button data-act="sort" data-s="like" aria-pressed="${st.sort==="like"}">기원 많은순</button></div></div>
   <div class="filters" role="group" aria-label="고민 분류">${CATS.map(c=>`<button class="chip" data-act="cat" data-c="${esc(c)}" aria-pressed="${st.cats.has(c)}">${esc(c)}</button>`).join("")}${st.cats.size?`<button class="chip" data-act="catclear">전체 보기</button>`:""}</div>
   <div class="cards">${list.length?list.map(p=>postCard(p)).join(""):emptyHTML(total)}</div>
  </section>`;
  st.justLiked=null;
}
function emptyHTML(total){
  if(total)return `<div class="empty"><strong>고른 분류의 기원문이 없어요</strong>다른 분류를 골라 보거나 전체 보기를 눌러 주세요.</div>`;
  return `<div class="empty"><strong>아직 ${RG[st.region].n}에 올라온 기원문이 없어요</strong>위의 ‘나의 기원문 공유하기’로 첫 기원을 남겨 주세요.</div>`;
}

function renderMy(){
  setTheme("region-home");
  const u=myUser(), mineP=livePosts().filter(p=>p.authorHx===me().hx).sort((a,b)=>b.createdAt-a.createdAt);
  const likedP=livePosts().filter(p=>liked(p.id)).sort((a,b)=>(S.likes.get(b.id+"_"+me().hx).createdAt)-(S.likes.get(a.id+"_"+me().hx).createdAt));
  if(st.mtab==="dash"&&!isAdmin())st.mtab="mine";
  const reg=u&&u.region?RG[u.region]:null;
  let body="";
  if(st.mtab==="mine")body=mineP.length?`<div class="cards">${mineP.map(p=>postCard(p,{showRegion:true})).join("")}</div>`:`<div class="empty"><strong>아직 쓴 기원문이 없어요</strong>지역 탭에서 첫 기원문을 남겨 보세요.</div>`;
  else if(st.mtab==="liked")body=likedP.length?`<div class="cards">${likedP.map(p=>postCard(p,{showRegion:true})).join("")}</div>`:`<div class="empty"><strong>함께 기원한 글이 아직 없어요</strong>마음이 가는 기원문에 하트를 눌러 보세요.</div>`;
  else body=dashHTML();
  $("#view").innerHTML=`${headerHTML()}
  <div class="gut"><button class="back" data-act="home">← 기원 이야기로</button>
   <section class="profile"><div class="name">${esc(st.nick)}${isAdmin()?'<span class="adm">관리자</span>':""}</div>
    <div class="belong">${reg?`소속 <span class="badge ${reg.b}">${reg.n}</span>`:`<span class="none">기원문을 작성해서 소속을 알려주세요</span>`}</div>
    <div class="pstats"><div><b>${mineP.length}</b><span>내가 쓴 기원문</span></div><div><b>${likedP.length}</b><span>함께 기원한 기원문</span></div></div>
   </section>
   <div class="mtabs" role="tablist"><button role="tab" data-act="mtab" data-t="mine" aria-selected="${st.mtab==="mine"}">내가 쓴 기원문</button><button role="tab" data-act="mtab" data-t="liked" aria-selected="${st.mtab==="liked"}">함께 기원한 기원문</button>${isAdmin()?`<button role="tab" data-act="mtab" data-t="dash" aria-selected="${st.mtab==="dash"}">대시보드</button>`:""}</div>
   ${body}
   <div style="display:flex;justify-content:center;padding-block:4px 30px"><button class="linkish" data-act="logout">닉네임 바꾸기</button></div>
  </div>`;
  st.justLiked=null;
}

/* ---------- 대시보드 ---------- */
function stats(rk){
  const inR=p=>rk==="all"||p.region===rk;
  const posts=livePosts().filter(inR), ids=new Set(posts.map(p=>p.id));
  const likes=[...S.likes.values()].filter(l=>ids.has(l.postId));
  const users=[...S.users.values()];
  return {
    users:rk==="all"?users.length:users.filter(u=>u.region===rk).length,
    posts:posts.length,
    people:new Set(likes.map(l=>l.nickHx)).size,
    likes:likes.length,
    cats:CATS.map(c=>{const ps=posts.filter(p=>(p.cats||[]).includes(c));const pid=new Set(ps.map(p=>p.id));const lk=likes.filter(l=>pid.has(l.postId));
      return {c,posts:ps.length,writers:new Set(ps.map(p=>p.authorHx)).size,people:new Set(lk.map(l=>l.nickHx)).size};})
  };
}
function dashHTML(){
  const rk=st.dRegion, s=stats(rk), unassigned=[...S.users.values()].filter(u=>!u.region).length;
  const maxP=Math.max(1,...s.cats.map(x=>x.posts)), sumCat=s.cats.reduce((a,x)=>a+x.posts,0);
  const rows=REGIONS.map(r=>({r,s:stats(r.k)}));
  const dels=[...S.posts.values()].filter(p=>p.deleted).map(p=>({type:"post",id:p.id,at:p.deletedAt,by:p.deletedBy,txt:titleOf(p.target),sub:p.author}))
    .concat([...S.comments.values()].filter(c=>c.deleted).map(c=>{const p=S.posts.get(c.postId);return {type:"cmt",id:c.id,at:c.deletedAt,by:c.deletedBy,txt:c.body,sub:c.author+(p?" · "+titleOf(p.target):"")}})).sort((a,b)=>(b.at||0)-(a.at||0));
  const label=rk==="all"?"전체":RG[rk].n;
  return `<div class="dash">
   <div class="dseg" role="group" aria-label="지역 필터">${[["all","전체"]].concat(REGIONS.map(r=>[r.k,r.n])).map(([k,n])=>`<button data-act="dreg" data-r="${k}" aria-pressed="${rk===k}">${n}</button>`).join("")}</div>
   <section class="panel"><h3>${label} 한눈에 보기<small>삭제된 글 제외</small></h3>
    <div class="kpis"><div class="kpi k1"><b>${s.users}</b><span>가입 닉네임</span></div><div class="kpi k2"><b>${s.posts}</b><span>기원문</span></div><div class="kpi k3"><b>${s.people}</b><span>함께 기원한 사람</span></div></div>
    <p class="note">${rk==="all"?`무소속(아직 기원문을 안 쓴) 닉네임 ${unassigned}명 포함 · 하트 총 ${s.likes}개`:`소속은 처음 기원문을 쓴 지역 기준 · 무소속 ${unassigned}명은 전체에서만 집계 · 하트 총 ${s.likes}개`}</p>
   </section>
   <section class="panel"><h3>소분류별 기원문 분포<small>${label} · 중복 선택 포함</small></h3>
    <div class="bars">${s.cats.map(x=>`<div class="bar-row"><span>${esc(x.c)}</span><div class="bar-track"><div class="bar-fill" style="width:${x.posts/maxP*100}%"></div></div><span class="v">${x.posts}건 ${sumCat?Math.round(x.posts/sumCat*100):0}%</span></div>`).join("")}</div>
   </section>
   <section class="panel"><h3>소분류별 현황<small>${label}</small></h3>
    <div class="tbl-wrap"><table><thead><tr><th>분류</th><th>작성한 닉네임</th><th>기원문</th><th>함께 기원</th></tr></thead>
    <tbody>${s.cats.map(x=>`<tr><td>${esc(x.c)}</td><td>${x.writers}</td><td>${x.posts}</td><td>${x.people}</td></tr>`).join("")}</tbody></table></div>
   </section>
   <section class="panel"><h3>지역별 비교</h3>
    <div class="tbl-wrap"><table><thead><tr><th>지역</th><th>가입 닉네임</th><th>기원문</th><th>함께 기원</th></tr></thead>
    <tbody>${rows.map(x=>`<tr><td><span class="badge ${x.r.b}">${x.r.n}</span></td><td>${x.s.users}</td><td>${x.s.posts}</td><td>${x.s.people}</td></tr>`).join("")}<tr><td>무소속</td><td>${unassigned}</td><td>–</td><td>–</td></tr></tbody>
    <tfoot><tr><td>전체</td><td>${S.users.size}</td><td>${livePosts().length}</td><td>${stats("all").people}</td></tr></tfoot></table></div>
   </section>
   <section class="panel"><h3>삭제 로그<small>${dels.length}건 · 복구 가능</small></h3>
    ${dels.length?`<div class="log">${dels.map(d=>`<div class="log-item"><div class="txt"><span class="kind">${d.type==="post"?"기원문":"댓글"}</span>${esc(d.txt.length>40?d.txt.slice(0,40)+"…":d.txt)}<small>${esc(d.sub)} · ${esc(d.by||"")} 삭제 · ${d.at?ago(d.at):""}</small></div><button class="restore" data-act="restore" data-type="${d.type}" data-id="${d.id}">복구</button></div>`).join("")}</div>`:`<p class="note">삭제된 기원문이나 댓글이 없어요.</p>`}
   </section></div>`;
}

/* ---------- 알림 ---------- */
function notiList(){
  if(!st.nick)return [];
  const seen=ls.get("woogle.seen."+me().hx,0), mine=new Map(livePosts().filter(p=>p.authorHx===me().hx).map(p=>[p.id,p])), out=[];
  S.likes.forEach(l=>{const p=mine.get(l.postId);if(p&&l.nickHx!==me().hx)out.push({k:"like",at:l.createdAt,p,isNew:l.createdAt>seen})});
  S.comments.forEach(c=>{const p=mine.get(c.postId);if(p&&!c.deleted&&c.authorHx!==me().hx)out.push({k:"cmt",at:c.createdAt,p,c,isNew:c.createdAt>seen})});
  return out.sort((a,b)=>b.at-a.at).slice(0,30);
}

/* ---------- 시트 ---------- */
function openSheet(s){st.sheet=s;st.editingCmt=null;drawSheet();}
function closeSheet(){st.sheet=null;st.editingCmt=null;$("#layer").innerHTML="";}
function refreshSheet(){
  const s=st.sheet;if(!s)return;
  if(s.type==="detail"){
    const p=S.posts.get(s.id);if(!p||p.deleted){closeSheet();return;}
    const a=$("#d-post");if(a)a.innerHTML=postCard(p,{full:true,showRegion:true});
    if(!st.editingCmt){const c=$("#d-cmts");if(c)c.innerHTML=cmtsHTML(p.id);}
  }else if(s.type==="noti"){const b=$("#n-body");if(b)b.innerHTML=notiHTML();}
}
function drawSheet(){
  const s=st.sheet;if(!s){$("#layer").innerHTML="";return;}
  let inner="";
  if(s.type==="write")inner=writeHTML(s);
  else if(s.type==="detail"){const p=S.posts.get(s.id);if(!p){closeSheet();return;}
    inner=`<div class="sheet-head"><h2>기원문</h2><button class="x" data-act="close" aria-label="닫기">${I.x}</button></div>
    <div class="detail-post" id="d-post" style="--strong:${RG[p.region].col}">${postCard(p,{full:true,showRegion:true})}</div>
    <div class="cmts"><h3>댓글</h3><div id="d-cmts">${cmtsHTML(p.id)}</div></div>
    <form class="cmt-form" id="cmt-form"><input id="cmt-in" maxlength="${CMT_MAX}" placeholder="${esc(st.nick)}(으)로 응원 한마디" autocomplete="off" aria-label="댓글 쓰기"><button type="submit">등록</button></form>`;}
  else if(s.type==="noti")inner=`<div class="sheet-head"><h2>알림</h2><button class="x" data-act="close" aria-label="닫기">${I.x}</button></div><div id="n-body">${notiHTML()}</div>`;
  $("#layer").innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet gut" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div></div>`;
  if(s.type==="write"){updateWritePreview();}
}
function notiHTML(){
  const L=notiList();
  if(!L.length)return `<p class="note" style="padding:14px 0">아직 새 소식이 없어요. 내 기원문에 하트나 댓글이 달리면 여기에 알려 드려요.</p>`;
  return `<div class="noti">${L.map(n=>`<button data-act="open" data-id="${n.p.id}" class="${n.isNew?"new":""}"><span class="ic">${n.k==="like"?I.heart.replace('<path','<path fill="currentColor" stroke="none"'):I.bubble}</span><span class="t">${n.k==="like"?`누군가 <b>${esc(titleOf(n.p.target))}</b>에 함께 기원했어요`:`<b>${esc(n.c.author)}</b>님의 댓글: ${esc(n.c.body.slice(0,40))}`}<small>${ago(n.at)}${n.isNew?" · 새 소식":""}</small></span></button>`).join("")}</div>`;
}
function cmtsHTML(pid){
  const L=liveCmts(pid);
  if(!L.length)return `<p class="no-cmt">첫 응원 댓글을 남겨 주세요.</p>`;
  return L.map(c=>{const mine=c.authorHx===me().hx;const editing=st.editingCmt===c.id;
    const tools=(mine||isAdmin())&&!editing?`<div class="tools">${mine?`<button class="icon-btn" data-act="cedit" data-id="${c.id}" aria-label="댓글 수정">${I.pen}</button>`:""}<button class="icon-btn del" data-act="cdel" data-id="${c.id}" aria-label="댓글 삭제">${I.trash}</button></div>`:"";
    return `<div class="cmt"><div class="cmt-top"><div class="meta"><b>${esc(c.author)}</b> · ${ago(c.createdAt)}${c.editedAt?" · 수정됨":""}</div>${tools}</div>
    ${editing?`<input class="field" id="cedit-in" maxlength="${CMT_MAX}" value="${esc(c.body)}" aria-label="댓글 수정"><div class="edit-row"><button data-act="ccancel">취소</button><button class="save" data-act="csave" data-id="${c.id}">저장</button></div>`:`<p>${esc(c.body)}</p>`}</div>`;}).join("");
}
function writeHTML(s){
  const p=s.id?S.posts.get(s.id):null;
  const d=s.draft||(s.draft={region:p?p.region:st.region,target:p?p.target:"",cats:new Set(p?p.cats:[]),body:p?p.body:""});
  return `<div class="sheet-head"><h2>${p?"기원문 고치기":"나의 기원문 쓰기"}</h2><button class="x" data-act="close" aria-label="닫기">${I.x}</button></div>
  <form class="form" id="write-form" novalidate>
   <div><p class="lbl">지역</p><div class="rg-pick" role="group" aria-label="지역">${REGIONS.map(r=>`<button type="button" class="${r.p}" data-act="wreg" data-r="${r.k}" aria-pressed="${d.region===r.k}">${r.n}</button>`).join("")}</div></div>
   <div><label class="lbl" for="w-target">기원할 사람<small>최대 ${TARGET_MAX}자</small></label><input class="field" id="w-target" maxlength="${TARGET_MAX}" placeholder="예: 우리 엄마, 김민준" value="${esc(d.target)}" autocomplete="off"></div>
   <div class="preview" id="w-preview"></div>
   <div><p class="lbl">어떤 기원인가요<small>여러 개 고를 수 있어요</small></p><div class="cat-pick" role="group" aria-label="소분류">${CATS.map(c=>`<button type="button" data-act="wcat" data-c="${esc(c)}" aria-pressed="${d.cats.has(c)}">${esc(c)}</button>`).join("")}</div></div>
   <div><label class="lbl" for="w-body">기원 내용<small id="w-count">0/${BODY_MAX}</small></label><textarea class="field" id="w-body" maxlength="${BODY_MAX}" placeholder="고민이나 바라는 일을 자유롭게 적어 주세요.">${esc(d.body)}</textarea></div>
   <p class="err" id="w-err"></p>
   <button class="btn" type="submit" id="w-submit">${p?"고친 내용 저장":"기원문 올리기"}</button>
  </form>`;
}
function updateWritePreview(){
  const s=st.sheet;if(!s||s.type!=="write")return;const d=s.draft;
  const pv=$("#w-preview");if(pv)pv.innerHTML=`<small>제목 미리보기</small>${esc(d.target.trim()?titleOf(d.target.trim()):"○○를 위한 기원")}`;
  const ct=$("#w-count");if(ct)ct.textContent=`${d.body.length}/${BODY_MAX}`;
}

/* ---------- 동작 ---------- */
async function login(nick){
  st.nick=nick;ls.set("woogle.nick",nick);
  const hx=hex(nick);
  if(!S.users.has(hx)){try{await put("users",hx,{nick,region:null,createdAt:now()})}catch(e){}}
  st.view="main";render();
}
async function submitWrite(){
  const s=st.sheet,d=s.draft,err=$("#w-err");const t=d.target.trim(),b=d.body.trim();
  if(!t){err.textContent="기원할 사람의 이름을 적어 주세요.";$("#w-target").focus();return}
  if(!d.cats.size){err.textContent="어떤 기원인지 하나 이상 골라 주세요.";return}
  if(b.length<2){err.textContent="기원 내용을 적어 주세요.";$("#w-body").focus();return}
  const btn=$("#w-submit");btn.disabled=true;
  try{
    if(s.id){await patch("posts",s.id,{target:t,body:b,cats:[...d.cats],region:d.region,editedAt:now()});toast("기원문을 고쳤어요.");}
    else{
      const id=mkId();
      await put("posts",id,{target:t,body:b,cats:[...d.cats],region:d.region,author:st.nick,authorHx:me().hx,createdAt:now(),deleted:false});
      const u=myUser();
      if(!u)await put("users",me().hx,{nick:st.nick,region:d.region,createdAt:now()});
      else if(!u.region)await patch("users",me().hx,{region:d.region});
      st.region=d.region;ls.set("woogle.region",d.region);st.sort="new";st.cats.clear();
      toast(u&&u.region?"기원문을 올렸어요.":`기원문을 올렸어요. 소속이 ${RG[d.region].n}으로 정해졌어요.`);
    }
    closeSheet();if(!s.id){st.view="main";window.scrollTo({top:0});}render();
  }catch(e){btn.disabled=false;}
}
async function like(id){
  if(liked(id))return;const p=S.posts.get(id);if(!p)return;
  const key=id+"_"+me().hx;
  st.justLiked=id;
  try{await put("likes",key,{postId:id,nickHx:me().hx,region:p.region,createdAt:now()});}catch(e){st.justLiked=null;}
  schedule();
}
async function softDelete(coll,id){
  try{await patch(coll,id,{deleted:true,deletedAt:now(),deletedBy:st.nick});toast(coll==="posts"?"기원문을 삭제했어요.":"댓글을 삭제했어요.");}catch(e){}
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,id=t.dataset.id;
  if(a==="scrim"){if(e.target===t)closeSheet();return}
  switch(a){
    case "home":closeSheet();st.view="main";render();window.scrollTo({top:0});break;
    case "my":closeSheet();st.view="my";render();window.scrollTo({top:0});break;
    case "region":st.region=t.dataset.r;ls.set("woogle.region",st.region);render();break;
    case "sort":st.sort=t.dataset.s;render();break;
    case "cat":{const c=t.dataset.c;st.cats.has(c)?st.cats.delete(c):st.cats.add(c);render();break}
    case "catclear":st.cats.clear();render();break;
    case "expand":st.expanded.add(id);render();break;
    case "write":if(!store.canWrite){toast("보기 전용이라 지금은 쓸 수 없어요.");break}openSheet({type:"write"});setTimeout(()=>{const x=$("#w-target");if(x)x.focus()},250);break;
    case "edit":openSheet({type:"write",id});break;
    case "close":closeSheet();break;
    case "wreg":st.sheet.draft.region=t.dataset.r;document.querySelectorAll('[data-act="wreg"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.r===t.dataset.r));break;
    case "wcat":{const d=st.sheet.draft,c=t.dataset.c;d.cats.has(c)?d.cats.delete(c):d.cats.add(c);t.setAttribute("aria-pressed",d.cats.has(c));$("#w-err").textContent="";break}
    case "like":await like(id);break;
    case "open":openSheet({type:"detail",id});break;
    case "delpost":await softDelete("posts",id);break;
    case "cdel":await softDelete("comments",id);break;
    case "cedit":st.editingCmt=id;{const c=$("#d-cmts");if(c)c.innerHTML=cmtsHTML(st.sheet.id);const i=$("#cedit-in");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}break;
    case "ccancel":st.editingCmt=null;refreshSheet();break;
    case "csave":{const v=($("#cedit-in").value||"").trim();if(!v){toast("댓글 내용을 적어 주세요.");break}try{await patch("comments",id,{body:v,editedAt:now()});st.editingCmt=null;refreshSheet();toast("댓글을 고쳤어요.")}catch(err){}break}
    case "noti":openSheet({type:"noti"});ls.set("woogle.seen."+me().hx,now());schedule();break;
    case "mtab":st.mtab=t.dataset.t;render();break;
    case "dreg":st.dRegion=t.dataset.r;render();break;
    case "restore":try{await patch(t.dataset.type==="post"?"posts":"comments",id,{deleted:false,restoredAt:now(),restoredBy:st.nick});toast("복구했어요.")}catch(err){}break;
    case "startlogin":{const w=$("#start-wrap");if(w)w.hidden=true;const f=$("#nick-form");if(f){f.hidden=false;const i=$("#nick-in");if(i)i.focus();}break}
    case "logout":ls.set("woogle.nick","");st.nick="";st.view="login";closeSheet();$("#view").innerHTML="";render();break;
  }
});
document.addEventListener("input",e=>{
  const s=st.sheet;if(!s||s.type!=="write")return;
  if(e.target.id==="w-target"){s.draft.target=e.target.value;updateWritePreview();$("#w-err").textContent=""}
  if(e.target.id==="w-body"){s.draft.body=e.target.value;updateWritePreview();$("#w-err").textContent=""}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="nick-form"){
    const v=($("#nick-in").value||"").trim().replace(/\s+/g," ");const er=$("#nick-err");
    if(v.length<2){er.textContent="닉네임을 2자 이상 적어 주세요.";return}
    if(v.length>NICK_MAX){er.textContent=`닉네임은 ${NICK_MAX}자까지 쓸 수 있어요.`;return}
    $("#nick-go").disabled=true;await login(v);
  }else if(e.target.id==="write-form"){await submitWrite();}
  else if(e.target.id==="cmt-form"){
    const inp=$("#cmt-in"),v=(inp.value||"").trim();if(!v)return;
    const pid=st.sheet.id;
    try{await put("comments",mkId(),{postId:pid,body:v,author:st.nick,authorHx:me().hx,createdAt:now(),deleted:false});inp.value="";refreshSheet();schedule();}catch(err){}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&st.sheet)closeSheet();});
setInterval(()=>{if(st.view!=="login")schedule()},60000);

/* ---------- 시작 ---------- */
(async()=>{
  await initStore();
  if(!RG[st.region])st.region="guri";
  if(st.nick){st.view="main";const hx=hex(st.nick);if(!S.users.has(hx)){try{await put("users",hx,{nick:st.nick,region:null,createdAt:now()})}catch(e){}}}
  else{st.view="login";$("#view").innerHTML="";}
  render();
})();
})();
</script>

</body>
</html>
